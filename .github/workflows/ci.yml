name: Wheelhouse checks
on:
  pull_request:
  push:
    branches: [main, arena/314fd2af-squeekchain-console]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and OS libraries
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Reject drift in committed generated browser assets
        run: git diff --exit-code -- web/bundle.js web/tools.json
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
