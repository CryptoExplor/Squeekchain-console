name: Wheelhouse checks
on:
  pull_request:
  push:
    branches: [main, arena/314fd2af-squeekchain-console]
  workflow_dispatch:
    inputs:
      live_rpc:
        description: Run optional real-browser public Sepolia RPC qualification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium and OS libraries
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - name: Optional live qualification (not a Phase 1 merge gate)
        if: github.event_name == 'workflow_dispatch' && inputs.live_rpc
        continue-on-error: true
        run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
