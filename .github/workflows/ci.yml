name: Wheelhouse checks
on:
  pull_request:
  push:
    branches: [main, arena/314fd2af-squeekchain-console, arena/b97eddeb-squeekchain-console]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium and OS libraries
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Reject drift in committed generated browser assets
        run: git diff --exit-code -- web/bundle.js web/tools.json web/hero3d.js web/premium-share.js web/premium-share.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
  browser-readonly-evidence:
    # This explicitly scoped job is separate from offline qualification. It never
    # installs a wallet, injects an adapter, mocks responses or calls signing tools.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["arena/ba7ca559-squeekchain-console","arena/b97eddeb-squeekchain-console"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the exact-head automatic preview
        run: node test/wait-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QA_REPOSITORY: ${{ github.repository }}
      - name: Real browser public reads and captures — no wallet or signing
        run: node test/browser-readonly-qa.mjs
        env:
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-readonly-evidence
          path: artifacts/live-browser-qa/
          retention-days: 7
          if-no-files-found: warn
